async function api(action, pl = {}, opt = {}) {
  LOAD++; $("#ld").style.display = "block";
  const ac = opt.timeout && typeof AbortController !== "undefined" ? new AbortController() : null; let tm = null;
  try {
    if (ac) tm = setTimeout(() => ac.abort(), opt.timeout);
    const r = await fetch(APPS_SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, namaAkun: S.u, sandi: S.p, ...pl }), signal: ac ? ac.signal : undefined });
    const j = await r.json(); if (j && j.serverNow) SRV_OFF = j.serverNow - Date.now(); return j; // jam server dipakai untuk status jadwal
  } catch (e) { return { ok: false, error: "Tidak dapat terhubung ke server: " + (e.name === "AbortError" ? "waktu habis" : e.message) }; } finally { clearTimeout(tm); if (--LOAD <= 0) { LOAD = 0; $("#ld").style.display = "none"; } }
}
const urut = (a) => [...new Set(a)].sort((x, y) => String(x).localeCompare(String(y), "id", { numeric: true }));

/* ---------- Mode tampilan & animasi ---------- */
const MODE = ["auto", "light", "dark"], MODE_L = { auto: "🌓 Otomatis", light: "☀️ Terang", dark: "🌙 Gelap" };
function modeGet() { try { return localStorage.getItem("tema") || "auto"; } catch (e) { return "auto"; } }
function terapkanMode() {
  const m = modeGet(); if (m === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", m);
  document.querySelectorAll(".mode").forEach((b) => (b.textContent = MODE_L[m] + " (ganti)"));
}
function gantiMode() { try { localStorage.setItem("tema", MODE[(MODE.indexOf(modeGet()) + 1) % 3]); } catch (e) { /* penyimpanan diblokir: tema tidak disimpan */ } terapkanMode(); }
function animar(el) { if (typeof el === "string") el = $(el); if (!el) return; el.classList.add("anim"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("anim"), 1000); }
new MutationObserver((ms) => ms.forEach((m) => { const t = m.target; if (t.id && ["bd", "f", "rp", "tb", "pg", "st"].includes(t.id) && m.addedNodes.length) animar(t); })).observe(document.body, { childList: true, subtree: true });
terapkanMode();

// Foto/scan tanda tangan diperkecil (maks. 360x140), latar putih dibuat transparan, dan dijaga < 44 ribu karakter agar muat di sel Spreadsheet.
function olahGambarTtd(file) {
  return new Promise((ok, gagal) => {
    const fr = new FileReader();
    fr.onerror = () => gagal(new Error("Gagal membaca berkas."));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => gagal(new Error("Berkas bukan gambar yang valid."));
      im.onload = () => {
        let skala = Math.min(1, 360 / im.width, 140 / im.height);
        for (let i = 0; i < 6; i++) {
          const w = Math.max(1, Math.round(im.width * skala)), h = Math.max(1, Math.round(im.height * skala)), c = document.createElement("canvas");
          c.width = w; c.height = h;
          const g = c.getContext("2d"); g.drawImage(im, 0, 0, w, h);
          const px = g.getImageData(0, 0, w, h), d = px.data;
          for (let j = 0; j < d.length; j += 4) { const m = Math.min(d[j], d[j + 1], d[j + 2]); if (m > 225) d[j + 3] = 0; else if (m > 170) d[j + 3] = Math.round((255 * (225 - m)) / 55); }
          g.putImageData(px, 0, 0);
          const hasil = c.toDataURL("image/png");
          if (hasil.length <= 44000) return ok(hasil);
          skala *= 0.8;
        }
        gagal(new Error("Gambar terlalu rumit atau besar. Gunakan gambar tanda tangan yang lebih sederhana."));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// Pemetaan dari kategori rekap ke tingkat capaian di bawah ini adalah usulan; ubah bila sekolah menetapkan lain.
const TAHAP = { "Sangat Baik": "mahir", Baik: "cakap", Cukup: "berkembang", Kurang: "mulai berkembang" };
const UMUM = { "Sangat Baik": "sangat baik", Baik: "baik", Cukup: "cukup", Kurang: "masih perlu ditingkatkan" };

const titik = (s) => (/[.!?]$/.test(s) ? s : s + ".");

function semesterDefault() { const d = new Date(), y = d.getFullYear(); return d.getMonth() >= 6 ? `Semester Ganjil ${y}/${y + 1}` : `Semester Genap ${y - 1}/${y}`; }
async function muatSKSemua() {
  if (SK && SK.temaId === "*") return true;

// Per murid: rata-rata nilai semua guru per indikator -> rata-rata per dimensi (gabungan tema terpilih) + subdimensi yang dinilai.
function hitungRapor(temaIds, kelas) {
  const set = new Set(temaIds), im = {}, bi = {}, per = {};
  INS.indikator.filter((i) => set.has(i.temaId)).forEach((i) => (im[i.id] = i));
  SK.nilai.forEach((r) => { if (!im[r[3]]) return; const k = r[0] + "|" + r[3]; (bi[k] = bi[k] || []).push(r[4]); });
  Object.keys(bi).forEach((k) => { const [m, ind] = k.split("|"), x = im[ind], pm = (per[m] = per[m] || {}), o = (pm[x.dim] = pm[x.dim] || { v: [], s: new Set(), t: new Set() }); o.v.push(avg(bi[k])); if (x.sub) o.s.add(x.sub); o.t.add(x.temaId); });
  return MURID.filter((m) => okKelas(m.kelas) && (!kelas || m.kelas === kelas)).sort((a, b) => a.kelas.localeCompare(b.kelas, "id", { numeric: true }) || a.nama.localeCompare(b.nama, "id")).map((m) => {
    const pm = per[m.id] || {};
    const dims = Object.keys(pm).map(Number).sort((a, b) => a - b).map((d) => ({ d, v: avg(pm[d].v), subs: (SUBD[d] || []).filter((s) => pm[d].s.has(s)).concat([...pm[d].s].filter((s) => !(SUBD[d] || []).includes(s))) }));
    const tm = new Set(); Object.keys(pm).forEach((d) => pm[d].t.forEach((t) => tm.add(t)));
    return { m, dims, all: avg(dims.map((z) => z.v)), tema: temaIds.filter((t) => tm.has(t)) };
  });
}

function narasiEr(x, cat) {

  const cs = [...new Set(cat.map((c) => titik(c.trim())).filter((c) => c.length > 1))];
  if (cs.length && sertakanCatatan()) t += "\nCatatan guru: " + cs.join(" ");

}

/* ---------- Penyusun instrumen (admin) ---------- */
const BLN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
function fmtPeriode(a, b) {
  if (!a) return "";
  const [y1, m1, d1] = a.split("-").map(Number);
  if (!b || b === a) return `${d1} ${BLN[m1 - 1]} ${y1}`;
  const [y2, m2, d2] = b.split("-").map(Number);
  if (y1 === y2 && m1 === m2) return `${d1}–${d2} ${BLN[m2 - 1]} ${y2}`;
  if (y1 === y2) return `${d1} ${BLN[m1 - 1]} – ${d2} ${BLN[m2 - 1]} ${y2}`;
  return `${d1} ${BLN[m1 - 1]} ${y1} – ${d2} ${BLN[m2 - 1]} ${y2}`;
}
function parsePeriode(t) {
  t = String(t || "").trim();
  const bi = (n) => BLN.findIndex((x) => x.toLowerCase() === String(n).toLowerCase()) + 1, p = (y, m, d) => y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  let m = t.match(/^(\d{1,2})\s*[–-]\s*(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
  if (m && bi(m[3])) return [p(m[4], bi(m[3]), m[1]), p(m[4], bi(m[3]), m[2])];
  m = t.match(/^(\d{1,2})\s+([A-Za-z]+)\s*[–-]\s*(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
  if (m && bi(m[2]) && bi(m[4])) return [p(m[5], bi(m[2]), m[1]), p(m[5], bi(m[4]), m[3])];
  m = t.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})\s*[–-]\s*(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
  if (m && bi(m[2]) && bi(m[5])) return [p(m[3], bi(m[2]), m[1]), p(m[6], bi(m[5]), m[4])];
  m = t.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
  if (m && bi(m[2])) return [p(m[3], bi(m[2]), m[1]), ""];
  return ["", ""];
}

  MURID.filter((m) => m.kelas === mFilter).forEach((m) => { const v = String(kelEf(m)).trim(); if (!v) tanpa++; else g[v] = (g[v] || 0) + 1; });
  const ks = Object.keys(g).sort((a, b) => a.localeCompare(b, "id", { numeric: true })), umum = ks.length ? Object.values(g).sort((a, b) => a - b)[Math.floor(ks.length / 2)] : 0;
  el.innerHTML = ks.map((k) => `<span class="tag" style="${g[k] !== umum ? "background:var(--goldS);border-color:#FDE68A;color:#A16207" : ""}">${esc(/^\d+$/.test(k) ? k : k)}: ${g[k]} murid</span>`).join(" ") + (tanpa ? ` <span class="tag nosub">tanpa kelompok: ${tanpa}</span>` : "") + (ks.some((k) => g[k] !== umum) ? ' <span class="muted">(kuning = jumlah anggota berbeda dari umumnya)</span>' : "");
}
function gambarDaftar() {
  const q = mCari.toLowerCase(), cmp = (x, y) => String(x).localeCompare(String(y), "id", { numeric: true });
  const rows = MURID.filter((m) => (!mFilter || m.kelas === mFilter) && (!q || m.nama.toLowerCase().includes(q) || String(kelEf(m)).toLowerCase().includes(q))).sort((a, b) => cmp(a.kelas, b.kelas) || cmp(kelEf(a), kelEf(b)) || cmp(a.nama, b.nama));
  $("#jm").textContent = rows.length + " murid";
  $("#dm").innerHTML = rows.length ? `<table><tr><th class="c"><input type="checkbox" id="hAll" title="Pilih semua murid yang tampil" aria-label="Pilih semua murid yang tampil" ${rows.every((m) => MHAPUS.has(m.id)) ? "checked" : ""}></th><th class="c">No</th><th>Kelas</th><th>Nama</th><th>Kelompok</th></tr>` + rows.map((m, i) => `<tr class="${m.id in KEL_EDIT ? "kchg" : ""}"><td class="c"><input type="checkbox" class="hck" data-id="${m.id}" ${MHAPUS.has(m.id) ? "checked" : ""} aria-label="Pilih ${esc(m.nama)} untuk dihapus"></td><td class="c">${i + 1}</td><td>${esc(m.kelas)}</td><td>${esc(m.nama)}</td><td><input class="kin" data-id="${m.id}" value="${esc(kelEf(m))}" inputmode="numeric" maxlength="40" placeholder="no." aria-label="Kelompok ${esc(m.nama)}"></td></tr>`).join("") + `</table>` : `<p class="muted">${MURID.length ? "Tidak ada murid yang cocok." : "Belum ada data murid. Impor berkas di atas."}</p>`;
  document.querySelectorAll("#dm .kin").forEach((i) => (i.oninput = () => {
    const m = MURID.find((x) => x.id === i.dataset.id), v = i.value.trim();
    if (v === tampilKel(m.kelompok)) delete KEL_EDIT[m.id]; else KEL_EDIT[m.id] = v;
    i.closest("tr").classList.toggle("kchg", m.id in KEL_EDIT); ringkasKel();
  }));
  document.querySelectorAll("#dm .hck").forEach((c) => (c.onchange = () => { if (c.checked) MHAPUS.add(c.dataset.id); else MHAPUS.delete(c.dataset.id); const a = $("#hAll"); if (a) a.checked = rows.every((m) => MHAPUS.has(m.id)); ringkasHapus(); }));
  const ha = $("#hAll"); if (ha) ha.onchange = () => { rows.forEach((m) => (ha.checked ? MHAPUS.add(m.id) : MHAPUS.delete(m.id))); document.querySelectorAll("#dm .hck").forEach((c) => (c.checked = ha.checked)); ringkasHapus(); };
  ringkasKel(); ringkasHapus();
}
function ringkasHapus() {
  const n = [...MHAPUS].filter((id) => MURID.some((m) => m.id === id)).length, b = $("#hS"), u = $("#hB"); if (!b) return;
  b.disabled = !n; b.textContent = n ? `Hapus ${n} murid terpilih` : "Hapus murid terpilih"; if (u) u.hidden = !n;
}
async function hapusMurid() {
  const ids = [...MHAPUS].filter((id) => MURID.some((m) => m.id === id)); if (!ids.length) return;
  const nm = ids.map((id) => MURID.find((m) => m.id === id)).map((m) => "• " + m.nama + " (" + m.kelas + ")");
  if (!confirm(`Hapus ${ids.length} murid berikut?\n\n${nm.slice(0, 10).join("\n")}${nm.length > 10 ? `\n... dan ${nm.length - 10} lainnya` : ""}\n\nSeluruh nilai, catatan, deskripsi rapor, dan jurnal murid ini ikut terhapus dan TIDAK DAPAT dikembalikan.`)) return;
  const b = $("#hS"); b.disabled = true; b.textContent = "Menghapus...";
  const r = await api("hapusMurid", { ids });
  if (!r.ok) { toast(r.error); ringkasHapus(); return; }
  MURID = r.murid; ids.forEach((id) => { MHAPUS.delete(id); delete KEL_EDIT[id]; }); SK = null;
  if (mFilter && !MURID.some((m) => m.kelas === mFilter)) mFilter = "";
  MURID_MSG = `<b>✅ ${r.jumlah} murid dihapus</b> beserta ${r.nilai} baris nilai, ${r.catatan} catatan, ${r.rapor} deskripsi rapor, dan ${r.jurnal} data jurnal. Total murid sekarang ${MURID.length}.`;
  toast(r.jumlah + " murid dihapus"); vMurid(); window.scrollTo(0, 0);
}
function bagiOtomatis() { // mengisi kolom Kelompok untuk satu kelas (belum disimpan)
  if (!mFilter) return toast("Pilih satu kelas dulu pada isian Kelas di bawah.");
  const n = Math.max(1, Math.min(10, Number($("#bn").value) || 2)), isi = MURID.filter((m) => m.kelas === mFilter);
  if (!isi.length) return;
  const cmp = (a, b) => a.nama.localeCompare(b.nama, "id");
  const ur = $("#bu").value === "acak" ? isi.map((m) => [Math.random(), m]).sort((a, b) => a[0] - b[0]).map((x) => x[1]) : $("#bu").value === "sekarang" ? [...isi].sort((a, b) => String(a.kelompok).localeCompare(String(b.kelompok), "id", { numeric: true }) || cmp(a, b)) : [...isi].sort(cmp);
  const g = Math.max(1, Math.floor(ur.length / n)), dasar = Math.floor(ur.length / g), lebih = ur.length % g; // sisa dibagikan ke kelompok terakhir (satu murid tambahan masing-masing)
  let i = 0;
  for (let k = 1; k <= g; k++) { const u = dasar + (k > g - lebih ? 1 : 0); for (let j = 0; j < u; j++, i++) { const m = ur[i], v = String(k); if (v === tampilKel(m.kelompok)) delete KEL_EDIT[m.id]; else KEL_EDIT[m.id] = v; } }
  gambarDaftar(); toast(`Dibagi menjadi ${g} kelompok (belum disimpan). Periksa lalu tekan "Simpan perubahan kelompok".`);
}
async function simpanKelompok() {
  const p = prefKel(), ch = Object.keys(KEL_EDIT).map((id) => ({ id, kelompok: simpanKel(KEL_EDIT[id], p) }));
  if (!ch.length) return;
  $("#kS").disabled = true; $("#kS").textContent = "Menyimpan...";
  const r = await api("ubahKelompok", { perubahan: ch });
  if (!r.ok) { toast(r.error); ringkasKel(); return; }
  MURID = r.murid; KEL_EDIT = {}; SK = null; toast(`Kelompok diperbarui (${r.jumlah} murid)`); gambarDaftar();
}
function vMurid() {

  <div class="card"><h2>Daftar Murid <span class="tag" id="jm"></span></h2>
  <p class="muted" style="margin-top:-4px">Ubah kelompok langsung di kolom <b>Kelompok</b>: cukup ketik nomornya (mis. <b>3</b>), kosongkan bila tanpa kelompok, lalu tekan Simpan. Nilai yang sudah tersimpan tidak berubah karena melekat pada murid.</p>

  <div><label>Cari nama atau kelompok</label><input id="mc" placeholder="Ketik nama..."></div></div><div class="sc" id="dm" style="margin-top:12px;max-height:480px"></div></div>`;
  $("#mf").value = mFilter; $("#mc").value = mCari;
  $("#hS").onclick = hapusMurid; $("#hB").onclick = () => { MHAPUS = new Set(); gambarDaftar(); };
  $("#kS").onclick = simpanKelompok; $("#kB").onclick = () => { KEL_EDIT = {}; gambarDaftar(); }; $("#bo").onclick = bagiOtomatis;
  $("#mf").onchange = () => { mFilter = $("#mf").value; gambarDaftar(); };
  $("#mc").oninput = () => { mCari = $("#mc").value; gambarDaftar(); };
  gambarDaftar();
  $("#tp").onclick = () => { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Kelas", "Nama", "Kelompok"], ["9A", "Nama Murid 1", "Kelompok 1"], ["9A", "Nama Murid 2", "Kelompok 1"]]), "Murid"); XLSX.writeFile(wb, "Templat_Data_Murid.xlsx"); };
  let hasil = null;
  $("#fl").onchange = async () => {
    const f = $("#fl").files[0]; hasil = null;
    if (!f) { $("#pvm").innerHTML = ""; return; }
    try { hasil = await bacaMurid(f); } catch (e) { $("#pvm").innerHTML = `<p class="err">Berkas tidak dapat dibaca.</p>`; return; }
    const ada = new Set(MURID.map((m) => m.kelas.toLowerCase() + "|" + m.nama.toLowerCase()));
    const sudah = hasil.murid.filter((m) => ada.has(m.kelas.toLowerCase() + "|" + m.nama.toLowerCase())).length;
    $("#pvm").innerHTML = `<h3>Pratinjau berkas</h3><p class="muted">${hasil.total} baris dibaca: <b>${hasil.murid.length}</b> valid, <b>${hasil.ditolak}</b> ditolak (Kelas atau Nama kosong). ${sudah} dari yang valid sudah ada di data (dilewati pada mode "Tambahkan").</p>
    <div class="sc" style="max-height:240px"><table><tr><th>Kelas</th><th>Nama</th><th>Kelompok</th></tr>${hasil.murid.slice(0, 300).map((m) => `<tr><td>${esc(m.kelas)}</td><td>${esc(m.nama)}</td><td>${esc(m.kelompok) || "-"}</td></tr>`).join("")}</table></div>${hasil.murid.length > 300 ? `<p class="muted">Menampilkan 300 baris pertama.</p>` : ""}`;
  };

    if (r.murid) MURID = r.murid; else { const m = await api("listMurid"); MURID = m.ok ? m.murid : MURID; }
    SK = null; mFilter = ""; mCari = "";
    MURID_MSG = `<b>✅ Impor selesai.</b> ${r.jumlah} murid ditambahkan, ${r.dilewati} dilewati (sudah ada).` + (h.ditolak ? ` ${h.ditolak} baris ditolak karena Kelas atau Nama kosong.` : "") + ` Total murid sekarang ${MURID.length}; daftar lengkapnya ada di bawah.`;
    toast(r.jumlah + " murid diimpor"); vMurid(); window.scrollTo(0, 0);
  };
}

/* ---------- Akun (admin) ---------- */
const PERAN_L = { guru: "Guru", pengolah: "Pengolah Nilai / Wali Kelas", admin: "Admin/Koordinator" };
const PERAN_O = Object.entries(PERAN_L);
const KELAS_HINT = "Kelas lain (selain kelas wali) yang boleh dinilai. Guru tanpa kelas dapat menilai semua kelas. Kelas ini tidak membuka rekap atau jurnal 7 KAIH.";
const WALI_HINT = "Satu kelas sendiri: Wali Kelas mengisi Jurnal 7 KAIH serta melihat rekap dan rapor kelas ini, dan otomatis boleh menilainya. Satu kelas hanya punya satu wali kelas.";
const opsiWali = (extra) => [["", "— Belum diatur —"]].concat([...new Set(kelasList().concat(extra ? [extra] : []))].map((k) => [k, k]));
async function vAkun() {
  const r = await api("listAkun");
  if (!r.ok) { $("#body").innerHTML = `<div class="card err">${esc(r.error)}</div>`; return; }
  const AK = Object.fromEntries(r.akun.map((a) => [a.guruId, a]));
  const tt = await api("getTtd", { gambar: false }), ks = tt.ok ? tt.ttd.find((x) => x.peran === "kepsek") : null;
  $("#body").innerHTML = `<div class="card"><h2>Akun Guru</h2><p class="muted" style="margin-top:-6px">Klik <b>Ubah</b> untuk mengganti nama, peran, atau penugasan kelas tanpa menghapus akun. <b>Kelas wali</b> (satu kelas, khusus Pengolah/Wali Kelas) = kelas sendiri untuk Jurnal 7 KAIH, rekap, dan rapor. <b>Kelas menilai</b> = kelas lain yang ditugaskan untuk menilai kegiatan; wali kelas selalu boleh menilai kelas walinya. Guru tanpa kelas dapat menilai semua kelas. Nilai yang sudah masuk tetap aman dan ikut memakai nama baru.</p><div class="sc"><table><tr><th>Nama</th><th>Akun</th><th>Peran</th><th>Kelas wali</th><th>Kelas menilai</th><th>Status</th><th></th></tr>` +
    r.akun.map((a) => `<tr><td>${esc(a.namaTampilan)}</td><td>${esc(a.namaAkun)}</td><td>${PERAN_L[a.peran] || esc(a.peran)}</td><td>${a.peran === "pengolah" ? (a.wali ? esc(a.wali) : '<span class="muted">belum diatur</span>') : "-"}</td><td>${a.peran === "pengolah" || a.peran === "guru" ? (a.kelas ? esc(a.kelas.split(",").join(", ")) : a.peran === "guru" ? '<span class="muted">Semua kelas</span>' : "-") : "-"}</td><td>${a.aktif ? "Aktif" : "Nonaktif"}</td><td>
    <button class="btn sm" data-a="ubah" data-id="${a.guruId}">✎ Ubah</button> ${a.peran !== "guru" ? `<button class="btn sec sm" data-a="ttd" data-id="${a.guruId}">✍️ TTD</button>` : ""} <button class="btn sec sm" data-a="sandi" data-id="${a.guruId}">Reset sandi</button> <button class="btn sec sm" data-a="aktif" data-id="${a.guruId}" data-v="${a.aktif ? 0 : 1}">${a.aktif ? "Nonaktifkan" : "Aktifkan"}</button> <button class="btn red sm" data-a="hapus" data-id="${a.guruId}">Hapus</button></td></tr>`).join("") + `</table></div></div>
  <div class="card"><h3 style="margin-top:0">Kepala Sekolah</h3><p class="muted">Nama, NIP, dan tanda tangan kepala sekolah dicetak pada bagian "Mengetahui" di rekap dan deskripsi rapor. Saat ini: <b>${ks && ks.nama ? esc(ks.nama) : "belum diisi"}</b>.</p><button class="btn sec" id="kpt">Atur data kepala sekolah</button></div>
  <div class="card"><h3 style="margin-top:0">Tambah akun</h3><div class="row"><div><label>Nama tampilan</label><input id="nt"></div><div><label>Nama akun (huruf kecil)</label><input id="na"></div><div><label>Sandi (min. 6)</label><input id="ns" type="password"></div>
  <div><label>Peran</label><select id="np">${PERAN_O.map((o) => `<option value="${o[0]}">${o[1]}</option>`).join("")}</select></div>
  <div id="nwali" hidden><label>Kelas wali (kelas sendiri)</label><select id="nw">${opsiWali().map((o) => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select><p class="muted" style="margin:4px 0 0">${WALI_HINT}</p></div>
  <div id="nkw"><label>Kelas lain yang ditugaskan untuk menilai</label>${ddKelasHtml(kelasList(), "nk", "Belum dipilih", KELAS_HINT)}</div></div><p><button class="btn" id="ta">Tambah</button></p></div>`;
  $("#kpt").onclick = async () => { await dlgTtd({ guruId: "kepsek", namaTampilan: "Kepala Sekolah" }); };
  ddKelasBind($("#nkw .dd"), "", "Belum dipilih");
  const nkw = () => { $("#nkw").hidden = !["guru", "pengolah"].includes($("#np").value); $("#nwali").hidden = $("#np").value !== "pengolah"; }; $("#np").onchange = nkw; nkw();
  $("#ta").onclick = async () => {
    const pr = $("#np").value, kelas = ["guru", "pengolah"].includes(pr) ? ddKelasVal($("#nkw .dd")) : "";
    const wali = pr === "pengolah" ? $("#nw").value : "";

    const h = await api("tambahAkun", { namaTampilanBaru: $("#nt").value, namaAkunBaru: $("#na").value, sandiBaru: $("#ns").value, peranBaru: pr, kelasBaru: kelas, waliBaru: wali });
    toast(h.ok ? "Akun ditambahkan" : h.error); if (h.ok) vAkun();
  };

    const id = b.dataset.id, a = AK[id]; let h;

      const F = [{ n: "nama", l: "Nama tampilan", t: "text" }, { n: "peran", l: "Peran", t: "select", o: PERAN_O }, { n: "wali", l: "Kelas wali (kelas sendiri)", t: "select", o: opsiWali(a.wali), if: ["peran", "pengolah"] }, { n: "kelas", l: "Kelas lain yang ditugaskan untuk menilai", t: "kelas", k0: "Belum dipilih", h: KELAS_HINT, if: ["peran", ["guru", "pengolah"]] }];
      return dlg("Ubah akun: " + a.namaAkun, F, { nama: a.namaTampilan, peran: a.peran, wali: a.wali, kelas: a.kelas }, async (o) => {
        if (!o.nama.trim()) return toast("Nama tampilan wajib diisi.");

        const x = await api("updateAkun", { guruId: id, namaTampilanBaru: o.nama, peranBaru: o.peran, waliBaru: o.peran === "pengolah" ? o.wali : "", kelasBaru: o.kelas });
        toast(x.ok ? "Akun diperbarui" : x.error); if (!x.ok) return;
        if (id === S.g.guruId) { S.g.namaTampilan = o.nama.trim(); shell(); } else vAkun();
      });
    }
    if (b.dataset.a === "sandi") { const sd = prompt("Sandi baru (min. 6 karakter):"); if (!sd) return; h = await api("updateAkun", { guruId: id, sandiBaru: sd }); }
    else if (b.dataset.a === "aktif") h = await api("updateAkun", { guruId: id, aktifBaru: b.dataset.v === "1" });
    else { if (!confirm("Hapus akun ini? Gunakan Ubah bila hanya ingin mengganti nama.")) return; h = await api("hapusAkun", { guruId: id }); }
    toast(h.ok ? "Berhasil" : h.error); if (h.ok) vAkun();
  }));
}
